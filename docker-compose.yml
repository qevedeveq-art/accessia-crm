# ═══════════════════════════════════════════════════════════
#  SENSIA MANAGER — Docker Compose
#  Services: backend (FastAPI) · frontend (Next.js) · Twenty CRM
# ═══════════════════════════════════════════════════════════

services:

  # ── Backend FastAPI ─────────────────────────────────────
  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ../:/sensia_data:rw
    environment:
      SENSIA_BASE_DIR: /sensia_data
      DATABASE_URL: sqlite:////sensia_data/_SENSIA_APP/sensia.db
      SECRET_KEY: ${SECRET_KEY:-CHANGEZ_MOI_cle_secrete_32_chars_min}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── Frontend Next.js (build production multi-stage) ─────
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8001
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
